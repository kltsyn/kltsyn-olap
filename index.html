<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>索引</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 1;
      color: var(--ink);
      background: var(--bg);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
    }
    main { max-width: 68rem; margin: 0; padding: 36px 48px 80px; }
    .outline {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
      background: #f3f1ec;
      border-inline-end: 1px solid var(--line);
      padding-block: 18px 28px;
      padding-inline: 14px 12px;
      margin: 0;
    }
    .outline > p { margin: 0 0 8px; color: var(--ink); font-weight: 600; font-size: 14px; }
    .outline ol { margin: 0; padding-left: 0; list-style: none; }
    .outline li { margin: 4px 0; font-size: 14px; line-height: 1.5; }
    .outline a { color: var(--ink); text-decoration: none; }
    .outline a:hover { text-decoration: underline; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      main { padding: 24px 16px 48px; }
      .outline { position: static; height: auto; border-inline-end: none; border-bottom: 1px solid var(--line); }
    }
    h1 { font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0 0 0.5em; hyphens: none; }
    p { margin: 0 0 0.75em; max-width: 68rem; }
  </style>
</head>
<body>
  <nav class="outline" aria-label="索引">
    <p>目录</p>
    <ol>
      <li><a href="olap/clickhouse-perf-memory.html">clickhouse</a></li>
    </ol>
  </nav>
  <main>
    <h1>索引</h1>
    <p>左边按主题列出。点 clickhouse 进入整体页。</p>
  </main>
</body>
</html>
